<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>นิยายนายบิ๊ก</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:ital,wght@0,300;0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0d1117;
            --bg-panel: #161b22;
            --border-color: #30363d;
            --accent-color: #8a2be2;
            --accent-hover: #9b4dff;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --user-msg: #1f2a3a;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: 'Sarabun', sans-serif;
            margin: 0; padding: 0;
            display: flex; justify-content: center; height: 100vh;
            background-image: radial-gradient(circle at 50% 0%, #1e1e2e 0%, transparent 70%);
        }

        #container { width: 100%; max-width: 900px; display: flex; flex-direction: column; height: 100vh; padding: 20px; box-sizing: border-box; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-main); }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

        .setup-panel {
            display: flex; flex-direction: column; gap: 15px; margin: auto;
            width: 100%; max-width: 600px; background: var(--bg-panel);
            padding: 40px; border-radius: 12px; border: 1px solid var(--border-color);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            animation: fadeIn 0.5s ease-out;
        }
        h2 { margin-top: 0; color: #fff; text-align: center; font-weight: 300; letter-spacing: 1px;}
        
        .input-group { display: flex; flex-direction: column; gap: 5px; }
        .input-group label { color: var(--accent-color); font-size: 14px; font-weight: bold; }
        
        textarea, input, select {
            background-color: var(--bg-main); color: #fff; border: 1px solid var(--border-color);
            padding: 12px; border-radius: 8px; font-size: 15px; font-family: inherit; outline: none; transition: border-color 0.3s;
        }
        textarea:focus, input:focus, select:focus { border-color: var(--accent-color); }
        
        button {
            background-color: var(--accent-color); color: white; border: none; padding: 14px 20px;
            border-radius: 8px; font-size: 16px; cursor: pointer; font-weight: bold; transition: all 0.3s ease;
        }
        button:hover { background-color: var(--accent-hover); transform: translateY(-2px); }
        button:active { transform: translateY(0); }
        .btn-secondary { background-color: transparent; border: 1px solid var(--text-muted); color: var(--text-muted); }
        .btn-secondary:hover { background-color: var(--text-muted); color: #fff; }

        #game-screen { display: none; flex-direction: column; height: 100%; animation: fadeIn 0.5s ease-in; }
        #story-board { flex-grow: 1; overflow-y: auto; padding: 20px; margin-bottom: 20px; display: flex; flex-direction: column; gap: 15px; scroll-behavior: smooth; }
        
        .message-row { max-width: 85%; padding: 15px 20px; border-radius: 12px; line-height: 1.7; animation: slideUp 0.3s ease-out; position: relative; }
        .role-user { background-color: var(--user-msg); color: #e5e7eb; align-self: flex-end; border-bottom-right-radius: 2px; font-style: italic; border: 1px solid #2d3748; }
        .role-model { background-color: var(--bg-panel); color: #fff; align-self: flex-start; border-bottom-left-radius: 2px; border-left: 3px solid var(--accent-color); box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        
        .edit-btn { background-color: transparent; border: 1px solid var(--border-color); color: var(--text-muted); font-size: 11px; padding: 4px 10px; margin-top: 10px; border-radius: 15px; display: inline-block; box-shadow: none; }
        .edit-btn:hover { background-color: var(--bg-main); color: #fff; border-color: #fff; transform: none; }

        #controls { display: flex; gap: 12px; background: var(--bg-panel); padding: 15px; border-radius: 12px; border: 1px solid var(--border-color); flex-wrap: wrap; }
        #action-type { width: 130px; font-weight: bold; color: var(--accent-color); }
        #action-input { flex-grow: 1; min-width: 200px;}
        .btn-danger { background-color: transparent; border: 1px solid #ef4444; color: #ef4444; box-shadow: none;}
        .btn-danger:hover { background-color: #ef4444; color: white; }

        #loading { display: none; align-self: flex-start; margin-left: 20px; color: var(--text-muted); font-size: 14px; }
        .dots::after { content: ''; animation: dots 1.5s steps(4, end) infinite; }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes dots { 0%, 20% { content: ''; } 40% { content: '.'; } 60% { content: '..'; } 80%, 100% { content: '...'; } }
    </style>
</head>
<body>

<div id="container">
    <div id="step-1" class="setup-panel">
        <h2>🌍 บทที่ 1: กฎเกณฑ์แห่งโลก</h2>
        <div class="input-group">
            <label>สภาพแวดล้อมและวัฒนธรรม</label>
            <textarea id="world-desc" rows="4" placeholder="เช่น โลกดิสโทเปียที่มีเวทมนตร์ปะปนกับเทคโนโลยี, เมืองลอยฟ้า..."></textarea>
        </div>
        <div class="input-group">
            <label>ระบบพลัง / กฎพิเศษ</label>
            <textarea id="world-rules" rows="3" placeholder="เช่น พลังเวทต้องแลกมาด้วยอายุขัย, กฎแรงโน้มถ่วงทำงานแบบพิเศษ..."></textarea>
        </div>
        <button onclick="goToStep(2)">สร้างตัวละคร ➔</button>
    </div>

    <div id="step-2" class="setup-panel" style="display: none;">
        <h2>👤 บทที่ 2: กำเนิดตัวตน</h2>
        <div class="input-group">
            <label>นามเรียกขาน</label>
            <input type="text" id="char-name" placeholder="ชื่อตัวละคร">
        </div>
        <div class="input-group">
            <label>คลาส / สายพลัง</label>
            <input type="text" id="char-class" placeholder="เช่น จอมเวทไร้นิพพาน">
        </div>
        <div class="input-group">
            <label>ปูมหลัง / เป้าหมาย</label>
            <textarea id="char-bg" rows="3" placeholder="แรงจูงใจในการออกเดินทางครั้งนี้..."></textarea>
        </div>
        <div style="display: flex; gap: 10px; margin-top: 10px;">
            <button onclick="goToStep(1)" class="btn-secondary" style="flex: 1;">⬅️ ย้อนกลับ</button>
            <button onclick="startGame()" style="flex: 2;">เริ่มการผจญภัย ⚔️</button>
        </div>
    </div>

    <div id="game-screen">
        <div id="story-board"></div>
        <div id="loading">Game Master กำลังแต่งแต้มเรื่องราว<span class="dots"></span></div>
        
        <div id="controls">
            <select id="action-type">
                <option value="do">🗡️ กระทำ (Do)</option>
                <option value="talk">💬 พูดคุย (Talk)</option>
                <option value="story">📜 กำหนด (Story)</option>
            </select>
            <input type="text" id="action-input" placeholder="พิมพ์สิ่งที่คุณต้องการกระทำต่อไปที่นี่..." onkeypress="handleEnter(event)" autocomplete="off">
            <button onclick="takeAction()">ส่ง</button>
            <button onclick="clearSave()" class="btn-danger">ลบเซฟเกม</button>
        </div>
    </div>
</div>

<script>
    const API_URL = "https://korawit007.onrender.com"; 
    let currentHistory = [];

    window.onload = function() {
        const saved = localStorage.getItem("adventure_save");
        if (saved) {
            const data = JSON.parse(saved);
            if (data.history && data.history.length > 0) {
                document.getElementById("world-desc").value = data.worldDesc || "";
                document.getElementById("world-rules").value = data.worldRules || "";
                document.getElementById("char-name").value = data.charName || "";
                document.getElementById("char-class").value = data.charClass || "";
                document.getElementById("char-bg").value = data.charBg || "";
                
                currentHistory = data.history;
                
                document.getElementById("step-1").style.display = "none";
                document.getElementById("step-2").style.display = "none";
                document.getElementById("game-screen").style.display = "flex";
                renderHistory();
            }
        }
    }

    function saveGame() {
        const saveData = {
            worldDesc: document.getElementById("world-desc").value,
            worldRules: document.getElementById("world-rules").value,
            charName: document.getElementById("char-name").value,
            charClass: document.getElementById("char-class").value,
            charBg: document.getElementById("char-bg").value,
            history: currentHistory
        };
        localStorage.setItem("adventure_save", JSON.stringify(saveData));
    }

    function clearSave() {
        if(confirm("คุณต้องการล้างความทรงจำทั้งหมด แล้วกลับไปสร้างตัวละครใหม่ใช่หรือไม่?")) {
            localStorage.removeItem("adventure_save");
            location.reload(); 
        }
    }

    function goToStep(step) {
        document.getElementById("step-1").style.display = step === 1 ? "flex" : "none";
        document.getElementById("step-2").style.display = step === 2 ? "flex" : "none";
    }

    function getCombinedSetting() {
        const wDesc = document.getElementById("world-desc").value || "-";
        const wRules = document.getElementById("world-rules").value || "-";
        const cName = document.getElementById("char-name").value || "ตัวละครนิรนาม";
        const cClass = document.getElementById("char-class").value || "-";
        const cBg = document.getElementById("char-bg").value || "-";

        return `[ข้อมูลโลกและสภาพแวดล้อม]: ${wDesc}\n[กฎและระบบพลัง]: ${wRules}\n[ข้อมูลตัวละคร]: ชื่อ: ${cName}, คลาส/สายพลัง: ${cClass}, ปูมหลัง: ${cBg}`;
    }

    async function startGame() {
        const combinedSetting = getCombinedSetting();
        
        document.getElementById("step-2").style.display = "none";
        document.getElementById("game-screen").style.display = "flex";
        toggleLoading(true);

        try {
            const res = await fetch(`${API_URL}/start_game`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ world_setting: combinedSetting })
            });
            const data = await res.json();
            currentHistory = data.history;
            renderHistory();
            saveGame(); 
        } catch (error) {
            alert("เชื่อมต่อกับ Game Master ไม่สำเร็จ กรุณาเช็ค Backend ครับ");
            goToStep(2); 
        } finally {
            toggleLoading(false);
        }
    }

    async function takeAction() {
        const actionType = document.getElementById("action-type").value;
        const actionInput = document.getElementById("action-input");
        const content = actionInput.value.trim();
        const combinedSetting = getCombinedSetting(); 

        if (!content) return;
        
        actionInput.value = "";
        toggleLoading(true);

        const board = document.getElementById("story-board");
        setTimeout(() => board.scrollTop = board.scrollHeight, 100);

        try {
            const res = await fetch(`${API_URL}/action`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    action_type: actionType, 
                    content: content,
                    history: currentHistory,       
                    world_setting: combinedSetting 
                })
            });
            const data = await res.json();
            currentHistory = data.history;
            renderHistory();
            saveGame(); 
        } catch (error) {
            alert("ระบบเวทมนตร์ขัดข้อง กรุณาลองพิมพ์ข้อความใหม่อีกครั้งครับ");
        } finally {
            toggleLoading(false);
        }
    }

    function editMessage(index) {
        const oldText = currentHistory[index].text;
        const newText = prompt("ดัดแปลงโชคชะตา (การแก้ไขจะถูกจำไว้ในเครื่องของคุณ):", oldText);
        
        if (newText !== null && newText.trim() !== "" && newText !== oldText) {
            currentHistory[index].text = newText; 
            renderHistory(); 
            saveGame(); 
        }
    }

    function renderHistory() {
        const board = document.getElementById("story-board");
        board.innerHTML = ""; 

        currentHistory.forEach((msg, index) => {
            const div = document.createElement("div");
            div.className = `message-row role-${msg.role}`;
            
            const formattedText = msg.text.replace(/\n/g, "<br>");
            div.innerHTML = `<div>${formattedText}</div>`;

            const editBtn = document.createElement("button");
            editBtn.className = "edit-btn";
            editBtn.innerText = "✎ ดัดแปลง";
            editBtn.onclick = () => editMessage(index);
            div.appendChild(editBtn);

            board.appendChild(div);
        });

        board.scrollTo({ top: board.scrollHeight, behavior: 'smooth' });
    }

    function toggleLoading(show) {
        document.getElementById("loading").style.display = show ? "block" : "none";
        document.getElementById("controls").style.opacity = show ? "0.6" : "1";
        
        document.getElementById("action-input").disabled = show;
        document.querySelector("#controls button").disabled = show;
        
        if(!show) document.getElementById("action-input").focus();
    }

    function handleEnter(e) {
        if (e.key === 'Enter') takeAction();
    }
</script>

</body>
</html>
